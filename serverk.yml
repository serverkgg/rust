# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GamePackage

metadata:
  id: rust
  name:
    ar: رست
    en: Rust
  description:
    ar: سيرفر رست في ماب مفتوحة وقاسية، تبدأ فيها بحجر وتنتهي بقاعدة محصّنة. اجمع الموارد، وابنِ بيتك، وكوّن فريقًا مع أصحابك، وأغيروا على قواعد غيركم. السيد وحجم الماب والوايب كلها تحت تحكمك من اللوحة.
    en: Rust dedicated servers in a harsh open world, where you start with a rock and end with a fortified base. Gather, build, team up with your friends and raid everyone else. The seed, the map size and the wipe are all yours to control from the panel.
  tagline:
    ar: ابنِ قاعدتك ودافع عنها وأغِر على غيرك، وسيرفرك جاهز خلال دقيقة
    en: Build your base, defend it, raid the rest, on a server ready in a minute
  category: survival
  logo: assets/logo.webp
  banner: assets/banner.webp

resources:
  minMemoryMb: 8192
  recommendedMemoryMb: 16384
  minDiskMb: 30720
  playersPerMemoryGb: 6
  maxRecommendedPlayers: 200

container:
  image: serverkgg/rust
  runtime:
    platform: linux
    installBudgetMinutes: 30
    bootBudgetMinutes: 12
    shmMb: 64
    pidsLimit: 512
  ports:
    - key: game
      containerPort: 28015
      protocol: udp
      mirror: true
      name:
        ar: رست
        en: Rust
      hint:
        ar: افتح الكونسول داخل اللعبة بزر F1، واكتب client.connect ثم العنوان كما يظهر.
        en: Open the in-game console with F1 and type client.connect followed by the address, exactly as shown.
      hostRange:
        default: 28015
        min: 28015
        max: 28114
    - key: query
      containerPort: 28017
      protocol: udp
      mirror: true
      name:
        ar: الاستعلام
        en: Query
      hint:
        ar: منفذ الاستعلام، ومنه يظهر سيرفرك في قائمة سيرفرات رست. لا يكتبه اللاعب أبدًا.
        en: The query port. It's how your server appears in the Rust server browser. Players never type it.
      hostRange:
        default: 28115
        min: 28115
        max: 28214
    - key: rcon
      containerPort: 28016
      protocol: tcp
      name:
        ar: WebRCON
        en: WebRCON
      hint:
        ar: للأدوات الخارجية فقط، ولا يدخل منه اللاعبون. يتفعّل عند تشغيل الوصول عن بُعد من اللوحة.
        en: For external tools only, never for players. It works once remote access is turned on in the panel.
      join: separate
      hostRange:
        default: 12500
        min: 12500
        max: 12599
      activeWhen:
        - variable: RCON_EXPOSED
          values:
            - "true"

backup:
  only:
    - server/**
  except:
    - server/**/*.map
    - server/**/*_occlusion_*.dat
    - server/**/*.sav.*
    - server/**/log/**
    - server/*/backup/**

secrets:
  - key: STEAM_WEB_API_KEY
    description:
      ar: مفتاح Steam Web API الخاص بالمنصة، ونجلب به صور حسابات Steam التي تظهر في جدول اللاعبين.
      en: The platform's Steam Web API key. It reads the Steam avatars shown in the players list.
    required: false

reset:
  keep:
    - Bundles
    - RustDedicated
    - RustDedicated_Data
    - Steam
    - cfg
    - runds.sh
    - steam_appid.txt
    - steamapps
    - "*.so*"
    - .steamcmd
    - .steam

presence:
  name: player
  id: steamId
  avatar: "https://avatars.steamstatic.com/{avatarHash}_full.jpg"
  fields:
    - key: platform
      label:
        ar: المنصة
        en: Platform
    - key: level
      label:
        ar: المستوى
        en: Level
    - key: ping
      label:
        ar: البنق
        en: Ping

files:
  protected:
    - .serverk-install.json
    - .serverk-wipe
  notable:
    - match: server/serverk/cfg/server.cfg
      label:
        ar: إعدادات السيرفر
        en: Server settings
      icon: settings
      color: "#cd412b"
      restart: true
      note:
        ar: إعدادات سيرفرك، من الاسم والوصف وعدد اللاعبين إلى حجم الماب والسيد. الأسهل تعديلها من تبويب الإعدادات، ويُطبَّق أي تعديل بعد الريستارت.
        en: Your server settings, from the name, description and player slots to the map size and seed. The settings tab is the easier way, and any change needs a restart.
    - match: server/serverk/cfg/users.cfg
      label:
        ar: الأدمن
        en: Admins
      icon: shield
      color: "#4a8fd4"
      restart: true
      note:
        ar: قائمة الأدمن والمودريتر. كل سطر ownerid أو moderatorid ومعه رقم Steam. أضف نفسك هنا لتفتح كونسول الأدمن داخل اللعبة بزر F1.
        en: Your admins and moderators. Each line is an ownerid or moderatorid with a Steam ID. Add yourself here to unlock the in-game admin console on F1.
    - match: server/serverk/cfg/bans.cfg
      label:
        ar: المحظورون
        en: Bans
      icon: sword
      color: "#c77dff"
      restart: true
      note:
        ar: اللاعبون المحظورون. تكتب رست في هذا الملف بنفسها عندما تحظر لاعبًا من اللوحة أو من الكونسول.
        en: The banned players. Rust writes this itself whenever you ban somebody from the panel or the console.
    - match: server/serverk
      label:
        ar: بيانات الماب
        en: Map data
      icon: map
      color: "#5ba32b"
      note:
        ar: الماب وكل ما بُني فيها وبيانات اللاعبين. لا تعدّل عليها والسيرفر شغّال، وخذ نسخة احتياطية قبل أي تعديل.
        en: The map, everything built on it and the player data. Don't touch it while the server runs, and take a backup first.

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: wipe
    name:
      ar: الوايب
      en: Wipes

guides:
  - id: getting-started
    title:
      ar: البدء بسيرفرك
      en: Getting started
    summary:
      ar: أنشئ سيرفر رست، وادخله مع أصحابك، واجعل نفسك أدمن.
      en: Create your Rust server, join it with your friends, and make yourself admin.
    tags:
      - start
    surfaces:
      - overview
      - setup
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md
  - id: wipes
    title:
      ar: متى تعمل وايب وكيف
      en: When and how to wipe
    summary:
      ar: معنى الوايب في رست، والفرق بين وايب الماب والوايب الكامل، وكيف تنفّذه من اللوحة.
      en: What a wipe means in Rust, the difference between a map wipe and a full wipe, and how to run one from the panel.
    tags:
      - wipe
    surfaces:
      - overview
      - panel
      - backups
    bodyPath:
      ar: guides/wipes/ar.md
      en: guides/wipes/en.md
